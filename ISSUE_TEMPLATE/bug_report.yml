name: 🐛 Bug report · Laporan bug
description: Report a reproducible problem · Laporkan masalah yang dapat direproduksi
title: "fix: <short summary of the bug>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please fill in the details below so we can reproduce and fix it fast.
        Terima kasih! Mohon isi detail di bawah agar kami dapat mereproduksi dan memperbaikinya dengan cepat.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist · Daftar periksa awal
      options:
        - label: I searched existing issues and this is not a duplicate. · Saya sudah mencari dan ini bukan duplikat.
          required: true
        - label: This is a bug, not a question (questions go to Discussions). · Ini bug, bukan pertanyaan.
          required: true
  - type: input
    id: affected
    attributes:
      label: Affected project / component · Proyek / komponen terdampak
      placeholder: e.g. GAESP · core-api · Flowtix
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? · Apa yang terjadi?
      description: A clear description of the bug. · Deskripsi jelas tentang bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior · Perilaku yang diharapkan
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce · Langkah reproduksi
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment · Lingkungan
      description: OS, browser, runtime versions, deployment (dev/prod). · OS, browser, versi runtime, lingkungan.
      placeholder: |
        - OS:
        - Browser / Runtime:
        - Version / Commit:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots · Log / tangkapan layar
      description: Paste relevant logs. **Redact secrets.** · Tempel log terkait. **Sensor rahasia.**
      render: shell
